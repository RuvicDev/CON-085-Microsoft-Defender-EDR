[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-defender-edr-connector"
version = "1.0.0"
description = "Gestión de endpoints protegidos con Microsoft Defender for Endpoint: consultar alertas, listar dispositivos, aislar/liberar dispositivos y obtener vulnerabilidades"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_defender_edr_connector*"]
